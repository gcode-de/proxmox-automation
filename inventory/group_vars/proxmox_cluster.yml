---
# NAS Configuration
nas_ip: "192.168.68.126"

# Keep booting when the NAS is locked. mount.nfs keeps retrying in the
# background for up to 10,000 minutes (nearly one week).
nfs_default_mount_opts: "defaults,_netdev,bg,retry=10000,nofail,noatime"

# NFS mount points required on every Proxmox node.
nfs_mounts:
  - name: "Privat"
    src: "/volume1/Privat"
    path: "/mnt/nas/Privat"

  - name: "scans"
    src: "/volume1/scans"
    path: "/mnt/nas/scans"

  - name: "docker"
    src: "/volume1/Docker"
    path: "/mnt/nas/Docker"

# Extend this list in inventory/host_vars/<hostname>.yml for mounts that are
# only needed on selected nodes.
nfs_host_mounts: []

# CTs with bind mounts below /mnt/nas. A pre-start hook prevents them from
# writing into the local directory underneath a missing NFS mount.
nfs_guarded_cts: []
