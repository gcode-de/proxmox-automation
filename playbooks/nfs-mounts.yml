- name: Configure NFS mounts on Proxmox cluster
  hosts: proxmox_cluster
  become: true

  vars:
    configured_nfs_mounts: "{{ nfs_mounts + (nfs_host_mounts | default([])) }}"

  tasks:
    - name: Install NFS client packages
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create mount point directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
      loop: "{{ configured_nfs_mounts }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Configure NFS mounts in fstab and mount
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ nas_ip }}:{{ item.src }}"
        fstype: nfs
        opts: "{{ item.opts | default(nfs_default_mount_opts) }}"
        state: mounted
        dump: 0
        passno: 0
      loop: "{{ configured_nfs_mounts }}"
      loop_control:
        label: "{{ item.name }}"
      notify: Reload systemd configuration

    - name: Verify mounts are accessible
      ansible.builtin.command:
        argv:
          - findmnt
          - --mountpoint
          - "{{ item.path }}"
      loop: "{{ configured_nfs_mounts }}"
      loop_control:
        label: "{{ item.name }}"
      register: mount_check
      changed_when: false

  handlers:
    - name: Reload systemd configuration
      ansible.builtin.systemd_service:
        daemon_reload: true
